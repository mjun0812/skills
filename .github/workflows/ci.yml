name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Run pre-commit hooks
        run: prek run --all-files --show-diff-on-failure

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v3
        with:
          cache: true

      - name: Install Claude Code
        run: mise use -g claude

      - name: Validate plugin and marketplace
        run: mise exec -- claude plugin validate . --strict
