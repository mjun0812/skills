<!-- exhtml template v1 -->
<!doctype html>
<html lang="ja" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>{{TITLE}}</title>
    <!--
  exhtml:template-begin
  この <style> から exhtml:template-end までは exhtml のテンプレート本体。
  ページ作成時・更新時に書き換えない。検査scriptがテンプレートとの一致を確認する。
-->
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap");

      :root {
        --ex-bg: #09090b;
        --ex-surface: #111114;
        --ex-ink: #f4f4f5;
        --ex-ink-body: #d4d4d8;
        --ex-muted: #a1a1aa;
        --ex-faint: #71717a;
        --ex-rule: #27272a;
        --ex-border: #303036;
        --ex-link: #f4f4f5;
        --ex-accent: #38bdf8;
        --ex-code-bg: #0c0c0f;
        --ex-code-inline: #18181b;
        --ex-diff-ins: #4ade80;
        --ex-diff-del: #f87171;
        --ex-diff-ins-bg: rgb(74 222 128 / 0.1);
        --ex-diff-del-bg: rgb(248 113 113 / 0.1);
        --ex-fig-line: #8f8f99;
        --ex-fig-1: #243d63;
        --ex-fig-2: #5c4f17;
        --ex-fig-3: #1f4630;
        --ex-fig-4: #452b5e;
        --ex-font-sans:
          "Geist", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic",
          -apple-system, BlinkMacSystemFont, sans-serif;
        --ex-font-mono:
          "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, "Noto Sans Mono CJK JP", monospace;
        --ex-radius: 0;
        --ex-chip-radius: 999px;
        --ex-border-w: 1px;
      }
      :root[data-theme="light"] {
        --ex-bg: #ffffff;
        --ex-surface: #fafafa;
        --ex-ink: #09090b;
        --ex-ink-body: #27272a;
        --ex-muted: #71717a;
        --ex-faint: #a1a1aa;
        --ex-rule: #e4e4e7;
        --ex-border: #d4d4d8;
        --ex-link: #09090b;
        --ex-accent: #0369a1;
        --ex-code-bg: #fafafa;
        --ex-code-inline: #f4f4f5;
        --ex-diff-ins: #15803d;
        --ex-diff-del: #dc2626;
        --ex-diff-ins-bg: rgb(21 128 61 / 0.08);
        --ex-diff-del-bg: rgb(220 38 38 / 0.08);
        --ex-fig-line: #71717a;
        --ex-fig-1: #d3e2f7;
        --ex-fig-2: #f6e4b8;
        --ex-fig-3: #cfe9d6;
        --ex-fig-4: #e5d6f2;
      }

      * {
        box-sizing: border-box;
      }
      html {
        background: var(--ex-bg);
      }
      body {
        margin: 0;
        background: var(--ex-bg);
        color: var(--ex-ink-body);
        font-family: var(--ex-font-sans);
        font-size: 16px;
        line-height: 1.85;
        font-feature-settings: "palt";
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
      }

      /* ---- ページ骨格: 左目次 / 本文 / 右用語集 ---------------------------- */
      .ex-page {
        max-width: 1600px;
        margin: 0 auto;
        padding: 56px 48px 72px;
      }
      .ex-wrap {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr) 300px;
        gap: 56px;
        align-items: start;
        margin-top: 40px;
        padding-top: 40px;
        border-top: var(--ex-border-w) solid var(--ex-rule);
      }
      .ex-main {
        min-width: 0;
      }
      .ex-main > h2:first-child {
        margin-top: 0;
      }
      .ex-toc,
      .ex-glossary {
        position: sticky;
        top: 24px;
        max-height: calc(100vh - 48px);
        overflow-y: auto;
        font-size: 13.5px;
        line-height: 1.7;
        scrollbar-width: thin;
        scrollbar-color: var(--ex-rule) transparent;
      }
      @media (max-width: 1100px) {
        .ex-page {
          padding: 24px 20px 48px;
        }
        .ex-wrap {
          display: block;
        }
        .ex-toc,
        .ex-glossary {
          position: static;
          max-height: none;
          overflow: visible;
          margin-bottom: 32px;
        }
      }

      /* ---- ヘッダー ------------------------------------------------------- */
      .ex-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 24px;
      }
      .ex-meta {
        margin: 12px 0 0;
        font-family: var(--ex-font-mono);
        font-size: 12.5px;
        color: var(--ex-faint);
      }
      .ex-lede {
        margin: 20px 0 0;
        max-width: 880px;
        font-size: 17px;
        color: var(--ex-muted);
      }
      .ex-theme-toggle {
        flex: none;
        font: inherit;
        font-size: 12.5px;
        font-family: var(--ex-font-mono);
        color: var(--ex-muted);
        background: transparent;
        border: var(--ex-border-w) solid var(--ex-border);
        border-radius: var(--ex-radius);
        padding: 4px 12px;
        cursor: pointer;
      }
      .ex-theme-toggle:hover {
        color: var(--ex-ink);
        background: var(--ex-surface);
      }
      .ex-summary {
        margin: 28px 0 0;
        padding: 14px 20px;
        background: var(--ex-surface);
        border: var(--ex-border-w) solid var(--ex-border);
        border-radius: var(--ex-radius);
      }
      .ex-summary ul {
        margin: 0;
        padding-left: 1.2em;
      }
      .ex-footer {
        margin-top: 72px;
        padding-top: 16px;
        border-top: var(--ex-border-w) solid var(--ex-rule);
        font-family: var(--ex-font-mono);
        font-size: 12px;
        color: var(--ex-faint);
      }

      /* ---- 見出し --------------------------------------------------------- */
      h1,
      h2,
      h3,
      h4 {
        color: var(--ex-ink);
        font-weight: 600;
        line-height: 1.4;
        letter-spacing: -0.01em;
        margin: 0;
      }
      h1 {
        font-size: 34px;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      h2 {
        font-size: 23px;
        margin: 64px 0 20px;
        padding-bottom: 10px;
        border-bottom: var(--ex-border-w) solid var(--ex-rule);
      }
      h3 {
        font-size: 18px;
        margin: 40px 0 12px;
      }
      h4 {
        font-size: 15.5px;
        margin: 28px 0 8px;
      }

      /* ---- 目次 ----------------------------------------------------------- */
      .ex-toc::before {
        content: "目次";
        display: block;
        margin-bottom: 12px;
        font-size: 13px;
        font-weight: 600;
        color: var(--ex-ink);
      }
      .ex-toc ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .ex-toc li {
        margin: 0;
      }
      .ex-toc a {
        display: block;
        padding: 4px 0 4px 14px;
        border-left: 1px solid var(--ex-rule);
        color: var(--ex-muted);
        text-decoration: none;
      }
      .ex-toc li.ex-toc-h3 a {
        padding-left: 28px;
        font-size: 13px;
      }
      .ex-toc a:hover {
        color: var(--ex-ink);
      }
      .ex-toc a.is-active {
        color: var(--ex-ink);
        border-left: 2px solid var(--ex-accent);
        padding-left: 13px;
      }
      .ex-toc li.ex-toc-h3 a.is-active {
        padding-left: 27px;
      }

      /* ---- 用語集 --------------------------------------------------------- */
      .ex-glossary h2 {
        font-size: 13px;
        letter-spacing: 0;
        border: none;
        padding: 0;
        margin: 0 0 12px;
      }
      .ex-glossary dl {
        margin: 0;
      }
      .ex-glossary dt {
        font-weight: 600;
        color: var(--ex-ink);
        margin-top: 14px;
      }
      .ex-glossary dt:first-child {
        margin-top: 0;
      }
      .ex-glossary dd {
        margin: 2px 0 0;
        font-size: 13px;
        color: var(--ex-muted);
      }
      .ex-glossary dt:target,
      .ex-glossary dt.is-target {
        color: var(--ex-accent);
      }
      a.ex-term {
        color: inherit;
        text-decoration: underline dotted var(--ex-faint);
        text-underline-offset: 4px;
      }

      /* ---- 本文要素 -------------------------------------------------------- */
      p {
        margin: 14px 0;
      }
      a {
        color: var(--ex-link);
        text-decoration: underline;
        text-decoration-color: var(--ex-faint);
        text-decoration-thickness: 1px;
        text-underline-offset: 4px;
      }
      a:hover {
        text-decoration-color: var(--ex-accent);
      }
      strong {
        color: var(--ex-ink);
        font-weight: 600;
      }
      em {
        font-style: normal;
        font-weight: 600;
        color: var(--ex-accent);
      }
      ul,
      ol {
        padding-left: 1.4em;
      }
      li {
        margin: 6px 0;
      }
      li::marker {
        color: var(--ex-faint);
      }
      hr {
        border: none;
        border-top: var(--ex-border-w) solid var(--ex-rule);
        margin: 40px 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14.5px;
        margin: 20px 0;
      }
      th,
      td {
        text-align: left;
        padding: 10px 14px 10px 0;
        border-bottom: 1px solid var(--ex-rule);
        vertical-align: top;
      }
      th {
        color: var(--ex-muted);
        font-size: 13px;
        font-weight: 500;
      }
      .ex-rowlabel {
        white-space: nowrap;
        font-weight: 600;
        color: var(--ex-ink);
      }

      .ex-card {
        background: var(--ex-surface);
        border: var(--ex-border-w) solid var(--ex-border);
        border-radius: var(--ex-radius);
        padding: 16px 20px;
        margin: 20px 0;
      }
      .ex-card > :last-child {
        margin-bottom: 0;
      }
      .ex-card-label {
        font-size: 12px;
        font-weight: 600;
        color: var(--ex-muted);
        letter-spacing: 0.04em;
        margin-bottom: 6px;
      }
      .ex-grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      .ex-grid-2 > .ex-card {
        margin: 0;
      }
      @media (max-width: 720px) {
        .ex-grid-2 {
          grid-template-columns: 1fr;
        }
      }
      .ex-chip {
        display: inline-block;
        font-family: var(--ex-font-mono);
        font-size: 12px;
        line-height: 1.5;
        padding: 1px 10px;
        background: var(--ex-surface);
        border: 1px solid var(--ex-border);
        border-radius: var(--ex-chip-radius);
        color: var(--ex-ink);
        margin-right: 4px;
      }
      .ex-note {
        border-left: 2px solid var(--ex-border);
        padding: 2px 18px;
        margin: 20px 0;
        color: var(--ex-muted);
      }
      .ex-note.is-important {
        border-left-color: var(--ex-accent);
        background: var(--ex-surface);
        padding: 6px 18px;
        color: var(--ex-ink-body);
      }
      blockquote.ex-quote {
        margin: 20px 0;
        padding: 14px 20px;
        background: var(--ex-surface);
        border: var(--ex-border-w) solid var(--ex-border);
      }
      blockquote.ex-quote p {
        margin: 6px 0;
      }
      .ex-quote-source {
        font-family: var(--ex-font-mono);
        font-size: 12px;
        color: var(--ex-faint);
      }
      details {
        margin: 20px 0;
        padding: 10px 18px;
        border: var(--ex-border-w) solid var(--ex-border);
      }
      summary {
        cursor: pointer;
        color: var(--ex-ink);
        font-size: 14.5px;
        font-weight: 600;
      }

      /* ---- 図 ------------------------------------------------------------- */
      .ex-figure {
        margin: 28px 0;
      }
      .ex-figure-frame {
        background: var(--ex-code-bg);
        border: 1px dotted var(--ex-faint);
        border-radius: var(--ex-radius);
        padding: 24px;
        overflow-x: auto;
        color: var(--ex-ink);
      }
      .ex-figure-frame svg {
        display: block;
        max-width: 100%;
        height: auto;
        margin: 0 auto;
        font-family: var(--ex-font-sans);
      }
      .ex-figure figcaption {
        margin-top: 10px;
        font-size: 13px;
        color: var(--ex-muted);
      }
      .ex-defs {
        position: absolute;
        width: 0;
        height: 0;
        overflow: hidden;
        color: var(--ex-fig-line);
      }
      /* 手描きSVGの部品。線は --ex-fig-line、文字は currentColor でテーマに追従する */
      .fig-node {
        fill: var(--ex-surface);
        stroke: var(--ex-fig-line);
        stroke-width: 1;
      }
      .fig-node.is-emphasis {
        stroke: currentColor;
        stroke-width: 2;
      }
      .fig-group {
        fill: none;
        stroke: var(--ex-fig-line);
        stroke-width: 1;
        stroke-dasharray: 2 4;
      }
      .fig-edge {
        fill: none;
        stroke: var(--ex-fig-line);
        stroke-width: 1;
        marker-end: url(#ex-arrow);
      }
      .fig-edge.is-dashed {
        stroke-dasharray: 6 4;
      }
      .fig-edge.is-plain {
        marker-end: none;
      }
      .fig-label {
        fill: currentColor;
        font-size: 14px;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .fig-label.is-small {
        font-size: 12px;
      }
      .fig-label.is-start {
        text-anchor: start;
      }
      .fig-label.is-muted {
        fill: var(--ex-muted);
      }
      .fig-wrap {
        font-size: 14px;
        line-height: 1.5;
        color: var(--ex-ink);
        text-align: center;
        padding: 6px 8px;
      }
      /* 図のカテゴリ色。塗りにだけ使う。意味は figcaption に書く */
      .fig-node.c1 {
        fill: var(--ex-fig-1);
      }
      .fig-node.c2 {
        fill: var(--ex-fig-2);
      }
      .fig-node.c3 {
        fill: var(--ex-fig-3);
      }
      .fig-node.c4 {
        fill: var(--ex-fig-4);
      }
      pre.mermaid {
        background: transparent;
        border: none;
        padding: 0;
        margin: 0;
        text-align: center;
      }
      pre.mermaid svg {
        max-width: 100%;
        height: auto;
        background: transparent !important;
      }
      pre.mermaid .node.c1 > rect,
      pre.mermaid .node.c1 > polygon,
      pre.mermaid .node.c1 > circle,
      pre.mermaid .node.c1 .label-container {
        fill: var(--ex-fig-1) !important;
      }
      pre.mermaid .node.c2 > rect,
      pre.mermaid .node.c2 > polygon,
      pre.mermaid .node.c2 > circle,
      pre.mermaid .node.c2 .label-container {
        fill: var(--ex-fig-2) !important;
      }
      pre.mermaid .node.c3 > rect,
      pre.mermaid .node.c3 > polygon,
      pre.mermaid .node.c3 > circle,
      pre.mermaid .node.c3 .label-container {
        fill: var(--ex-fig-3) !important;
      }
      pre.mermaid .node.c4 > rect,
      pre.mermaid .node.c4 > polygon,
      pre.mermaid .node.c4 > circle,
      pre.mermaid .node.c4 .label-container {
        fill: var(--ex-fig-4) !important;
      }

      /* ---- コード ---------------------------------------------------------- */
      pre {
        margin: 20px 0;
        padding: 16px 18px;
        background: var(--ex-code-bg);
        border: 1px solid var(--ex-border);
        border-radius: var(--ex-radius);
        overflow-x: auto;
        font-family: var(--ex-font-mono);
        font-size: 13px;
        line-height: 1.7;
      }
      pre[data-lang]::before {
        content: attr(data-lang);
        display: block;
        position: sticky;
        left: 0;
        width: fit-content;
        margin-bottom: 10px;
        font-size: 11.5px;
        letter-spacing: 0.04em;
        color: var(--ex-faint);
      }
      pre code {
        font-family: inherit;
        font-size: 1em;
        background: none;
        border: none;
        padding: 0;
      }
      code {
        font-family: var(--ex-font-mono);
        font-size: 0.875em;
        background: var(--ex-code-inline);
        border: 1px solid var(--ex-rule);
        padding: 1px 5px;
      }
      pre.shiki,
      pre.shiki code {
        background: var(--ex-code-bg) !important;
      }
      :root[data-theme="dark"] .shiki span {
        color: var(--shiki-dark);
        font-style: var(--shiki-dark-font-style);
        font-weight: var(--shiki-dark-font-weight);
      }
      :root[data-theme="light"] .shiki span {
        color: var(--shiki-light);
        font-style: var(--shiki-light-font-style);
        font-weight: var(--shiki-light-font-weight);
      }
      /* 行の背景をpreの左右の端まで敷く。長い行では行の幅に合わせて伸びる */
      pre.ex-diff .ins,
      pre.ex-diff .del {
        display: inline-block;
        vertical-align: top;
        min-width: calc(100% + 36px);
        margin: 0 -18px;
        padding: 0 18px;
      }
      pre.ex-diff .ins {
        color: var(--ex-diff-ins);
        background: var(--ex-diff-ins-bg);
      }
      pre.ex-diff .del {
        color: var(--ex-diff-del);
        background: var(--ex-diff-del-bg);
      }
      pre.ex-diff .ins::before {
        content: "+ ";
      }
      pre.ex-diff .del::before {
        content: "- ";
      }
      pre.ex-diff .ctx::before {
        content: "  ";
      }

      /* ---- 数式 ----------------------------------------------------------- */
      mjx-container[display="true"] {
        margin: 16px 0;
        overflow-x: auto;
      }

      /* ---- 印刷: 常にライト ---------------------------------------------- */
      @media print {
        :root,
        :root[data-theme="dark"] {
          --ex-bg: #ffffff;
          --ex-surface: #ffffff;
          --ex-ink: #09090b;
          --ex-ink-body: #27272a;
          --ex-muted: #71717a;
          --ex-faint: #a1a1aa;
          --ex-rule: #e4e4e7;
          --ex-border: #d4d4d8;
          --ex-link: #09090b;
          --ex-accent: #0369a1;
          --ex-code-bg: #fafafa;
          --ex-code-inline: #f4f4f5;
          --ex-diff-ins: #15803d;
          --ex-diff-del: #dc2626;
          --ex-diff-ins-bg: rgb(21 128 61 / 0.08);
          --ex-diff-del-bg: rgb(220 38 38 / 0.08);
          --ex-fig-line: #71717a;
          --ex-fig-1: #d3e2f7;
          --ex-fig-2: #f6e4b8;
          --ex-fig-3: #cfe9d6;
          --ex-fig-4: #e5d6f2;
        }
        :root[data-theme="dark"] .shiki span {
          color: var(--shiki-light);
          font-style: var(--shiki-light-font-style);
          font-weight: var(--shiki-light-font-weight);
        }
        body {
          font-size: 12pt;
          line-height: 1.7;
        }
        .ex-page {
          max-width: none;
          padding: 0;
        }
        .ex-wrap {
          display: block;
        }
        .ex-toc,
        .ex-theme-toggle {
          display: none;
        }
        .ex-glossary {
          position: static;
          max-height: none;
          page-break-inside: avoid;
        }
        .ex-figure,
        .ex-card,
        pre,
        table {
          page-break-inside: avoid;
        }
        h2 {
          page-break-after: avoid;
        }
      }
</style>
    <!-- exhtml:template-end -->

    <!-- exhtml:mathjax 数式が無いページでは、このコメントから /exhtml:mathjax までを削除する -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["$$", "$$"],
            ["\\[", "\\]"],
          ],
        },
        options: { skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"] },
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- /exhtml:mathjax -->
  </head>
  <body>
    <svg class="ex-defs" aria-hidden="true" focusable="false">
      <defs>
        <marker
          id="ex-arrow"
          viewBox="0 0 10 10"
          refX="9"
          refY="5"
          markerWidth="8"
          markerHeight="8"
          orient="auto-start-reverse"
        >
          <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"></path>
        </marker>
      </defs>
    </svg>
    <div class="ex-page">
      <header class="ex-header">
        <div>
          <h1>{{TITLE}}</h1>
          <p class="ex-meta">created {{CREATED}} / updated {{UPDATED}} / model {{MODEL}}</p>
        </div>
        <button class="ex-theme-toggle" type="button" data-theme-toggle aria-label="テーマ切替">
          light
        </button>
      </header>

      <p class="ex-lede">{{LEDE}}</p>

      <div class="ex-summary">
        <ul>
          {{SUMMARY}}
        </ul>
      </div>

      <div class="ex-wrap">
        <nav class="ex-toc" aria-label="目次" data-toc></nav>

        <main class="ex-main">{{BODY}}</main>

        <aside class="ex-glossary">
          <h2>用語</h2>
          <dl>{{GLOSSARY}}</dl>
        </aside>
      </div>

      <footer class="ex-footer">exhtml</footer>
    </div>

    <!-- exhtml:runtime テーマ切替と目次生成。削除しない -->
    <script>
      (() => {
        const KEY = "exhtml-theme";
        const root = document.documentElement;
        const button = document.querySelector("[data-theme-toggle]");
        const apply = (theme) => {
          root.dataset.theme = theme;
          if (button) button.textContent = theme === "dark" ? "light" : "dark";
          document.dispatchEvent(new CustomEvent("exhtml:theme", { detail: { theme } }));
        };
        let saved = null;
        try {
          saved = localStorage.getItem(KEY);
        } catch (_) {
          saved = null;
        }
        apply(saved === "light" ? "light" : "dark");
        if (button) {
          button.addEventListener("click", () => {
            const next = root.dataset.theme === "dark" ? "light" : "dark";
            try {
              localStorage.setItem(KEY, next);
            } catch (_) {}
            apply(next);
          });
        }

        const glossary = document.querySelector(".ex-glossary");
        const wide = window.matchMedia("(min-width: 1101px)");
        if (glossary) {
          document.addEventListener("click", (event) => {
            const link = event.target.closest('a[href^="#term-"]');
            if (!link || !wide.matches) return;
            const dt = glossary.querySelector(link.getAttribute("href"));
            if (!dt) return;
            event.preventDefault();
            glossary
              .querySelectorAll("dt.is-target")
              .forEach((el) => el.classList.remove("is-target"));
            dt.classList.add("is-target");
            glossary.scrollTo({ top: dt.offsetTop - 8, behavior: "smooth" });
          });
        }

        const toc = document.querySelector("[data-toc]");
        const main = document.querySelector(".ex-main");
        if (!toc || !main) return;
        const headings = [...main.querySelectorAll("h2[id], h3[id]")];
        if (headings.length === 0) return;
        const list = document.createElement("ol");
        const links = new Map();
        for (const h of headings) {
          const li = document.createElement("li");
          li.className = h.tagName === "H3" ? "ex-toc-h3" : "ex-toc-h2";
          const a = document.createElement("a");
          a.href = "#" + h.id;
          a.textContent = h.textContent;
          li.appendChild(a);
          list.appendChild(li);
          links.set(h.id, a);
        }
        toc.appendChild(list);
        let current = null;
        const setActive = (id) => {
          if (id === current) return;
          if (current && links.get(current)) links.get(current).classList.remove("is-active");
          if (links.get(id)) links.get(id).classList.add("is-active");
          current = id;
        };
        const update = () => {
          const line = window.innerHeight * 0.3;
          let id = headings[0].id;
          for (const h of headings) {
            if (h.getBoundingClientRect().top > line) break;
            id = h.id;
          }
          setActive(id);
        };
        window.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update);
        update();
      })();
    </script>
    <!-- /exhtml:runtime -->

    <!-- exhtml:shiki コードブロックが無いページでは、このコメントから /exhtml:shiki までを削除する -->
    <script type="module">
      try {
        const { codeToHtml } = await import("https://esm.sh/shiki@4");
        const blocks = [...document.querySelectorAll("pre > code[class*='language-']")];
        for (const code of blocks) {
          const lang = (code.className.match(/language-([\w-]+)/) || [])[1];
          if (!lang || lang === "plaintext" || lang === "text") continue;
          const pre = code.parentElement;
          pre.dataset.lang = lang;
          try {
            const html = await codeToHtml(code.textContent, {
              lang,
              themes: { light: "github-light", dark: "github-dark" },
              defaultColor: false,
            });
            const tmp = document.createElement("div");
            tmp.innerHTML = html;
            const rendered = tmp.firstElementChild;
            if (rendered) {
              rendered.dataset.lang = lang;
              pre.replaceWith(rendered);
            }
          } catch (_) {
            /* 未対応言語はそのまま表示する */
          }
        }
      } catch (_) {
        /* CDNに到達できないときは素のコードのまま表示する */
      }
    </script>
    <!-- /exhtml:shiki -->

    <!-- exhtml:mermaid Mermaidの図が無いページでは、このコメントから /exhtml:mermaid までを削除する -->
    <script type="module">
      try {
        const mermaid = (
          await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")
        ).default;
        mermaid.registerLayoutLoaders(
          (
            await import(
              "https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0.2/dist/mermaid-layout-elk.esm.min.mjs"
            )
          ).default,
        );
        const nodes = [...document.querySelectorAll("pre.mermaid")];
        if (nodes.length === 0) throw new Error("no diagrams");
        nodes.forEach((n) => {
          n.dataset.src = n.textContent;
          n.classList.add("ex-mermaid");
        });
        let generation = 0;
        const cssVar = (name) =>
          getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        const render = async () => {
          generation += 1;
          const theme = document.documentElement.dataset.theme;
          mermaid.initialize({
            startOnLoad: false,
            securityLevel: "strict",
            layout: "elk",
            theme: "base",
            darkMode: theme === "dark",
            fontFamily: cssVar("--ex-font-sans"),
            themeVariables: {
              background: cssVar("--ex-surface"),
              primaryColor: cssVar("--ex-surface"),
              primaryTextColor: cssVar("--ex-ink"),
              primaryBorderColor: cssVar("--ex-fig-line"),
              secondaryColor: cssVar("--ex-bg"),
              secondaryTextColor: cssVar("--ex-ink"),
              secondaryBorderColor: cssVar("--ex-fig-line"),
              tertiaryColor: cssVar("--ex-bg"),
              tertiaryTextColor: cssVar("--ex-ink"),
              tertiaryBorderColor: cssVar("--ex-fig-line"),
              lineColor: cssVar("--ex-fig-line"),
              textColor: cssVar("--ex-ink"),
              mainBkg: cssVar("--ex-surface"),
              nodeBorder: cssVar("--ex-fig-line"),
              clusterBkg: cssVar("--ex-bg"),
              clusterBorder: cssVar("--ex-muted"),
              edgeLabelBackground: cssVar("--ex-surface"),
              actorBkg: cssVar("--ex-surface"),
              actorBorder: cssVar("--ex-fig-line"),
              actorTextColor: cssVar("--ex-ink"),
              signalColor: cssVar("--ex-fig-line"),
              signalTextColor: cssVar("--ex-ink"),
              noteBkgColor: cssVar("--ex-bg"),
              noteBorderColor: cssVar("--ex-fig-line"),
              noteTextColor: cssVar("--ex-ink"),
              attributeBackgroundColorOdd: cssVar("--ex-surface"),
              attributeBackgroundColorEven: cssVar("--ex-bg"),
              fontSize: "14px",
            },
          });
          for (let i = 0; i < nodes.length; i++) {
            try {
              const { svg } = await mermaid.render(
                `ex-fig-${generation}-${i}`,
                nodes[i].dataset.src,
              );
              nodes[i].innerHTML = svg;
            } catch (err) {
              nodes[i].textContent = nodes[i].dataset.src;
              console.error("mermaid render failed", i, err);
            }
          }
        };
        await render();
        document.addEventListener("exhtml:theme", () => {
          render();
        });
      } catch (_) {
        /* CDNに到達できないときは記法をそのまま表示する */
      }
    </script>
    <!-- /exhtml:mermaid -->
  </body>
</html>
